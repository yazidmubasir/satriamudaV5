<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>Sistem Sekolah Web App</title>
  <?!= include('Css'); ?>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div style="font-size:36px;margin-bottom:8px">🏫</div>
    <h2>Sistem Sekolah</h2>
    <p class="muted">Silakan masuk menggunakan akun Anda</p>
    
    <label>Username</label>
    <input id="li-username" placeholder="Masukkan username / NIS">
    
    <label>Password</label>
    <input id="li-password" type="password" placeholder="Masukkan password">
    
    <button style="width:100%;margin-top:16px" onclick="doLogin()">Masuk ke Sistem</button>
    
    <div style="text-align:center;margin-top:16px;">
      <a href="#" style="font-size:12px;color:var(--muted);text-decoration:none" onclick="doBootstrap();return false;">⚙️ Bootstrap Sistem (Inisialisasi)</a>
    </div>
  </div>
</div>

<div id="app">
  <div id="topbar">
    <div class="brand">
      <span>🏫</span> Sistem Sekolah
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span id="tb-nama" style="font-weight:600"></span>
      <span class="role-badge" id="tb-role"></span>
      <button class="secondary small" onclick="openChangePassword()">Ganti Password</button>
      <button class="danger small" onclick="doLogout()">Keluar</button>
    </div>
  </div>
  
  <div id="layout">
    <div id="sidebar-container">
      <?!= include('Sidebar'); ?>
    </div>
    <div id="content"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box" id="modal-box"></div>
</div>
<div class="toast" id="toast"></div>

<!-- COMPONENT LOADERS -->
<?!= include('Module_UI'); ?>

<script>
let TOKEN = null, USER = null;

function toast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg; 
  t.className = 'toast' + (isError ? ' error' : '');
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 3200);
}

function call(fnName, args) {
  args = args || [];
  return new Promise((resolve, reject) => {
    const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(e => reject(e));
    runner[fnName].apply(runner, args);
  });
}

function doLogin() {
  const u = document.getElementById('li-username').value;
  const p = document.getElementById('li-password').value;
  if(!u || !p) return toast('Username dan Password wajib diisi', true);

  call('login', [u, p]).then(res => {
    TOKEN = res.token; USER = res.user;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('tb-nama').textContent = USER.nama || USER.username;
    document.getElementById('tb-role').textContent = USER.role.toUpperCase();
    buildSidebar();
  }).catch(e => toast(e.message || String(e), true));
}

function doBootstrap() {
  call('bootstrapSystem', ['']).then(res => toast(res.message)).catch(e => toast(e.message || String(e), true));
}

function doLogout() {
  call('logout', [TOKEN]).then(() => { location.reload(); });
}

function showModal(html) {
  document.getElementById('modal-box').innerHTML = html;
  document.getElementById('modal-overlay').style.display = 'flex';
}

function closeModal() { 
  document.getElementById('modal-overlay').style.display = 'none'; 
}

function openChangePassword() {
  showModal(`
    <h3>🔒 Ganti Password</h3>
    <label>Password Lama</label><input type="password" id="cp-old">
    <label>Password Baru</label><input type="password" id="cp-new">
    <div style="margin-top:16px;text-align:right;display:flex;gap:8px;justify-content:flex-end">
      <button class="secondary" onclick="closeModal()">Batal</button>
      <button onclick="submitChangePassword()">Simpan Password</button>
    </div>
  `);
}

function submitChangePassword() {
  const o = document.getElementById('cp-old').value;
  const n = document.getElementById('cp-new').value;
  call('changePassword', [TOKEN, o, n]).then(res => { 
    toast(res.message); closeModal(); 
  }).catch(e => toast(e.message || String(e), true));
}
</script>

</body>
</html>
