<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root{
    --primary:#2f6f4f; --primary-dark:#234f39; --bg:#f4f6f5; --card:#ffffff;
    --border:#e0e4e2; --text:#1f2a24; --muted:#6b7a72; --danger:#c0392b; --warn:#b8860b;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
  #login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .login-box{background:var(--card);padding:36px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.08);width:340px;}
  .login-box h2{margin-top:0;color:var(--primary-dark);text-align:center;}
  input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:6px;margin-bottom:4px;font-size:14px;background:#fff;color:var(--text);}
  label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-top:10px;}
  .hint{font-size:11px;color:var(--muted);margin:2px 0 6px;font-style:italic;}
  button{cursor:pointer;border:none;border-radius:6px;padding:9px 16px;font-size:14px;font-weight:600;background:var(--primary);color:#fff;}
  button:hover{background:var(--primary-dark);}
  button.secondary{background:#eef1ef;color:var(--text);}
  button.secondary:hover{background:#dfe4e1;}
  button.danger{background:var(--danger);}
  button.small{padding:5px 10px;font-size:12px;}
  #app{display:none;min-height:100vh;}
  #topbar{display:flex;justify-content:space-between;align-items:center;background:var(--primary-dark);color:#fff;padding:10px 20px;}
  #topbar .role-badge{background:#ffffff22;padding:3px 10px;border-radius:20px;font-size:12px;margin-left:8px;}
  #layout{display:flex;}
  #sidebar{width:230px;background:#fff;min-height:calc(100vh - 48px);border-right:1px solid var(--border);padding:14px 0;}
  #sidebar .item{padding:10px 20px;cursor:pointer;font-size:14px;color:var(--text);border-left:3px solid transparent;}
  #sidebar .item:hover{background:#f0f4f2;}
  #sidebar .item.active{border-left-color:var(--primary);background:#eef6f1;font-weight:600;color:var(--primary-dark);}
  #sidebar .group-title{padding:14px 20px 4px;font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.5px;}
  #content{flex:1;padding:22px;max-width:1100px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:16px;}
  h2.page-title{margin-top:0;color:var(--primary-dark);}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;}
  th,td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:left;}
  th{background:#f7f9f8;color:var(--muted);font-size:12px;text-transform:uppercase;}
  tr:hover{background:#fafcfb;}
  .actions button{margin-right:4px;}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);align-items:center;justify-content:center;z-index:50;}
  .modal-box{background:#fff;border-radius:10px;padding:22px;width:440px;max-height:85vh;overflow:auto;}
  .modal-box h3{margin-top:0;}
  .toast{position:fixed;top:16px;right:16px;background:#222;color:#fff;padding:12px 18px;border-radius:8px;z-index:100;display:none;font-size:13px;max-width:320px;}
  .toast.error{background:var(--danger);}
  .col-block{border:1px dashed var(--border);border-radius:8px;padding:12px;margin-bottom:10px;}
  .col-row{display:flex;gap:6px;align-items:center;margin-bottom:4px;}
  .col-row input{margin-bottom:0;}
  .pill{display:inline-block;background:#eef6f1;color:var(--primary-dark);padding:3px 9px;border-radius:20px;font-size:11px;margin:2px;}
  .muted{color:var(--muted);font-size:12px;}
  .flexrow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .flexrow > div{flex:1;min-width:160px;}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h2>🏫 Sistem Sekolah</h2>
    <label>Username</label>
    <input id="li-username" placeholder="username">
    <label>Password</label>
    <input id="li-password" type="password" placeholder="password">
    <button style="width:100%;margin-top:14px" onclick="doLogin()">Masuk</button>
    <div style="text-align:center;margin-top:14px;">
      <a href="#" style="font-size:12px;color:var(--muted)" onclick="doBootstrap();return false;">Bootstrap sistem (pertama kali)</a>
    </div>
  </div>
</div>

<div id="app">
  <div id="topbar">
    <div><strong id="tb-title">🏫 Sistem Sekolah</strong></div>
    <div>
      <span id="tb-nama"></span>
      <span class="role-badge" id="tb-role"></span>
      <button class="secondary small" onclick="openChangePassword()">Ganti Password</button>
      <button class="danger small" onclick="doLogout()">Keluar</button>
    </div>
  </div>
  <div id="layout">
    <div id="sidebar"></div>
    <div id="content"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box" id="modal-box"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ============================================================
// STATE
// ============================================================
let TOKEN = null, USER = null;

function toast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast' + (isError ? ' error':'');
  t.style.display = 'block';
  setTimeout(()=>{ t.style.display='none'; }, 3200);
}
function gsRun(fn){
  return new Promise((resolve,reject)=>{
    google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(e)).apply(null, [fn].concat([].slice.call(arguments,1)))
  });
}
function call(fnName, args){
  args = args || [];
  return new Promise((resolve,reject)=>{
    const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(e));
    runner[fnName].apply(runner, args);
  });
}

// ============================================================
// AUTH
// ============================================================
function doLogin(){
  const u = document.getElementById('li-username').value;
  const p = document.getElementById('li-password').value;
  call('login',[u,p]).then(res=>{
    TOKEN = res.token; USER = res.user;
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('tb-nama').textContent = USER.nama || USER.username;
    document.getElementById('tb-role').textContent = USER.role;
    buildSidebar();
  }).catch(e=>toast(e.message||String(e), true));
}
function doBootstrap(){
  call('bootstrapSystem',['']).then(res=>toast(res.message)).catch(e=>toast(e.message||String(e), true));
}
function doLogout(){
  call('logout',[TOKEN]).then(()=>{ location.reload(); });
}
function openChangePassword(){
  showModal(`
    <h3>Ganti Password</h3>
    <label>Password Lama</label><input type="password" id="cp-old">
    <label>Password Baru</label><input type="password" id="cp-new">
    <div style="margin-top:14px;text-align:right">
      <button class="secondary" onclick="closeModal()">Batal</button>
      <button onclick="submitChangePassword()">Simpan</button>
    </div>
  `);
}
function submitChangePassword(){
  const o = document.getElementById('cp-old').value;
  const n = document.getElementById('cp-new').value;
  call('changePassword',[TOKEN,o,n]).then(res=>{ toast(res.message); closeModal(); }).catch(e=>toast(e.message||String(e), true));
}

// ============================================================
// MODAL HELPERS
// ============================================================
function showModal(html){
  document.getElementById('modal-box').innerHTML = html;
  document.getElementById('modal-overlay').style.display='flex';
}
function closeModal(){ document.getElementById('modal-overlay').style.display='none'; }

// ============================================================
// SIDEBAR
// ============================================================
function buildSidebar(){
  const sb = document.getElementById('sidebar');
  let html = '';
  if(USER.role === 'owner'){
    html += grp('Master Data');
    html += item('Master Users', "viewMasterCrud('master_users')");
    html += item('Master Guru', "viewMasterCrud('master_guru')");
    html += item('Master Karyawan', "viewMasterCrud('master_karyawan')");
    html += item('Master Kelas', "viewMasterCrud('master_kelas')");
    html += item('Master Mapel', "viewMasterCrud('master_mapel')");
    html += grp('Pengaturan Sistem');
    html += item('Manajemen Menu', 'viewMenuManager()');
    html += item('Modul Kegiatan (Builder)', 'viewModulManager()');
    html += item('Admin Kelas & Spreadsheet', 'viewAdminKelasManager()');
    html += item('Sheet & Kolom per Kelas', 'viewSheetBuilder()');
    html += grp('Laporan');
    html += item('Data Agregasi Semua Kelas', 'viewAggregasi()');
  }
  if(USER.role === 'admin_kelas'){
    html += grp('Kelas Saya');
    html += item('Data Siswa', 'viewSiswaManager()');
    html += item('Aktivasi Modul Kegiatan', 'viewModulAktivasi()');
    html += item('Kelola Sheet & Kolom', 'viewSheetBuilder()');
  }
  html += grp('Menu');
  sb.innerHTML = html;
  call('getMenusForUser',[TOKEN]).then(menus=>{
    let dyn = '';
    menus.forEach(m=>{
      dyn += `<div class="item" onclick="viewDynamicMenu('${m.menu_id}')">${m.icon||'📄'} ${m.nama_menu}</div>`;
    });
    sb.innerHTML += dyn;
  });
  if(Object.keys(document.getElementById('content').dataset).length === 0){
    document.getElementById('content').innerHTML = `<div class="card"><h2 class="page-title">Selamat datang, ${USER.nama||USER.username}</h2><p class="muted">Silakan pilih menu di sebelah kiri.</p></div>`;
  }
  function grp(t){ return `<div class="group-title">${t}</div>`; }
  function item(label, onclick){ return `<div class="item" onclick="${onclick}">${label}</div>`; }
}
function setActive(el){
  document.querySelectorAll('#sidebar .item').forEach(i=>i.classList.remove('active'));
}

// ============================================================
// GENERIC CRUD TABLE (dipakai untuk master data, siswa, sheet kegiatan)
// ============================================================
/**
 * config = {
 *   title, columns:[{key,label,type,hint,options}], pkField ('username' atau '__row'),
 *   load: ()=>Promise<array>, onAdd:(obj)=>Promise, onUpdate:(pk,obj)=>Promise, onDelete:(pk)=>Promise,
 *   readOnly: bool, note: string
 * }
 */
function renderGenericCrud(config){
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="card">
      <h2 class="page-title">${config.title}</h2>
      ${config.note ? `<p class="muted">${config.note}</p>` : ''}
      ${config.readOnly ? '' : `<button onclick='openCrudForm(${JSON.stringify(config.columns).replace(/'/g,"&#39;")}, null)'>+ Tambah Data</button>`}
      <div id="crud-table-wrap"><p class="muted">Memuat data...</p></div>
    </div>
  `;
  window.__currentCrudConfig = config;
  config.load().then(rows=>{
    window.__currentCrudRows = rows;
    renderCrudTableRows(config, rows);
  }).catch(e=>toast(e.message||String(e), true));
}
function renderCrudTableRows(config, rows){
  const wrap = document.getElementById('crud-table-wrap');
  if(!rows.length){ wrap.innerHTML = '<p class="muted">Belum ada data.</p>'; return; }
  let html = '<table><thead><tr>';
  config.columns.forEach(c=>{ if(c.type!=='password') html += `<th>${c.label}</th>`; });
  if(!config.readOnly) html += '<th>Aksi</th>';
  html += '</tr></thead><tbody>';
  rows.forEach((r,idx)=>{
    html += '<tr>';
    config.columns.forEach(c=>{
      if(c.type==='password') return;
      let v = r[c.key];
      if(v instanceof Date) v = v.toLocaleString();
      html += `<td>${v!==undefined && v!==null ? v : ''}</td>`;
    });
    if(!config.readOnly){
      html += `<td class="actions">
        <button class="small secondary" onclick="openCrudFormEdit(${idx})">Edit</button>
        <button class="small danger" onclick="confirmCrudDelete(${idx})">Hapus</button>
      </td>`;
    }
    html += '</tr>';
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
}
function openCrudForm(columns, existing){
  const config = window.__currentCrudConfig;
  let html = `<h3>${existing ? 'Edit Data' : 'Tambah Data'}</h3>`;
  config.columns.forEach(c=>{
    const val = existing ? (existing[c.key] !== undefined ? existing[c.key] : '') : '';
    html += `<label>${c.label}</label>`;
    if(c.hint) html += `<div class="hint">${c.hint}</div>`;
    if(c.type === 'select'){
      html += `<select id="cf-${c.key}">`;
      (c.options||[]).forEach(o=>{ html += `<option value="${o}" ${val===o?'selected':''}>${o}</option>`; });
      html += `</select>`;
    } else if(c.type === 'password'){
      html += `<input type="password" id="cf-${c.key}" placeholder="${existing ? 'kosongkan jika tidak diubah' : ''}">`;
    } else if(c.readonlyOnEdit && existing){
      html += `<input id="cf-${c.key}" value="${val}" disabled>`;
    } else {
      html += `<input id="cf-${c.key}" value="${val}">`;
    }
  });
  html += `<div style="margin-top:14px;text-align:right">
    <button class="secondary" onclick="closeModal()">Batal</button>
    <button onclick="submitCrudForm(${existing ? JSON.stringify(existing.__pk).replace(/'/g,"&#39;") : 'null'})">Simpan</button>
  </div>`;
  showModal(html);
}
function openCrudFormEdit(idx){
  const rows = window.__currentCrudRows;
  const config = window.__currentCrudConfig;
  const r = rows[idx];
  r.__pk = config.pkField === '__row' ? r.__row : r[config.pkField];
  openCrudForm(config.columns, r);
}
function submitCrudForm(pk){
  const config = window.__currentCrudConfig;
  const obj = {};
  config.columns.forEach(c=>{
    const el = document.getElementById('cf-'+c.key);
    if(!el) return;
    if(c.type==='password' && !el.value) return; // jangan kirim password kosong
    obj[c.key] = el.value;
  });
  const promise = (pk===null || pk===undefined) ? config.onAdd(obj) : config.onUpdate(pk, obj);
  promise.then(res=>{
    toast(res.message); closeModal();
    config.load().then(rows=>{ window.__currentCrudRows = rows; renderCrudTableRows(config, rows); });
  }).catch(e=>toast(e.message||String(e), true));
}
function confirmCrudDelete(idx){
  if(!confirm('Yakin ingin menghapus data ini?')) return;
  const config = window.__currentCrudConfig;
  const rows = window.__currentCrudRows;
  const r = rows[idx];
  const pk = config.pkField === '__row' ? r.__row : r[config.pkField];
  config.onDelete(pk).then(res=>{
    toast(res.message);
    config.load().then(rows2=>{ window.__currentCrudRows = rows2; renderCrudTableRows(config, rows2); });
  }).catch(e=>toast(e.message||String(e), true));
}

// ============================================================
// VIEW: MASTER DATA CRUD (poin 1, 5)
// ============================================================
const MASTER_FIELD_CONFIG = {
  master_users: {
    title: 'Master Users (Login Guru / Karyawan / Admin Kelas / Owner)',
    note: 'Password disimpan dalam bentuk SHA-256 hash. Username & password siswa dikelola oleh admin_kelas di menu Data Siswa masing-masing kelas.',
    pkField: 'username',
    columns: [
      {key:'username', label:'Username', readonlyOnEdit:true},
      {key:'password', label:'Password', type:'password', hint:'Kosongkan saat edit jika tidak ingin mengubah password'},
      {key:'role', label:'Role', type:'select', options:['owner','guru','karyawan','admin_kelas']},
      {key:'nama_lengkap', label:'Nama Lengkap'},
      {key:'status', label:'Status', type:'select', options:['aktif','nonaktif']}
    ]
  },
  master_guru: {
    title:'Master Guru', pkField:'nip',
    columns:[
      {key:'nip', label:'NIP', readonlyOnEdit:true},
      {key:'nama', label:'Nama'},
      {key:'mapel', label:'Mapel Diampu'},
      {key:'no_hp', label:'No HP'},
      {key:'alamat', label:'Alamat'},
      {key:'status', label:'Status', type:'select', options:['aktif','nonaktif']}
    ]
  },
  master_karyawan: {
    title:'Master Karyawan', pkField:'nip',
    columns:[
      {key:'nip', label:'NIP/NIK', readonlyOnEdit:true},
      {key:'nama', label:'Nama'},
      {key:'jabatan', label:'Jabatan'},
      {key:'no_hp', label:'No HP'},
      {key:'alamat', label:'Alamat'},
      {key:'status', label:'Status', type:'select', options:['aktif','nonaktif']}
    ]
  },
  master_kelas: {
    title:'Master Kelas', pkField:'kode_kelas',
    note:'spreadsheet_id & admin_kelas_username sebaiknya diatur lewat menu "Admin Kelas & Spreadsheet" agar role user ikut ter-update otomatis.',
    columns:[
      {key:'kode_kelas', label:'Kode Kelas', readonlyOnEdit:true, hint:'Contoh: 7A, 8B'},
      {key:'nama_kelas', label:'Nama Kelas'},
      {key:'wali_kelas', label:'Wali Kelas'},
      {key:'spreadsheet_id', label:'Spreadsheet ID Kelas', hint:'ID spreadsheet Google Sheets khusus kelas ini'},
      {key:'admin_kelas_username', label:'Username Admin Kelas'},
      {key:'status', label:'Status', type:'select', options:['aktif','nonaktif']}
    ]
  },
  master_mapel: {
    title:'Master Mapel', pkField:'kode_mapel',
    columns:[
      {key:'kode_mapel', label:'Kode Mapel', readonlyOnEdit:true},
      {key:'nama_mapel', label:'Nama Mapel'},
      {key:'guru_pengampu', label:'Guru Pengampu'},
      {key:'status', label:'Status', type:'select', options:['aktif','nonaktif']}
    ]
  }
};
function viewMasterCrud(sheetName){
  const fc = MASTER_FIELD_CONFIG[sheetName];
  renderGenericCrud({
    title: fc.title, note: fc.note, columns: fc.columns, pkField: fc.pkField,
    readOnly: USER.role !== 'owner',
    load: ()=> call('getMasterList',[TOKEN, sheetName]),
    onAdd: (obj)=> call('addMasterRow',[TOKEN, sheetName, obj]),
    onUpdate: (pk,obj)=> call('updateMasterRow',[TOKEN, sheetName, pk, obj]),
    onDelete: (pk)=> call('deleteMasterRow',[TOKEN, sheetName, pk])
  });
}

// ============================================================
// VIEW: MENU MANAGER (poin 12, 13, 16) - OWNER ONLY
// ============================================================
function viewMenuManager(){
  renderGenericCrud({
    title:'Manajemen Menu Sistem',
    note:'Menu ini akan muncul di sidebar sesuai role_akses. role_akses diisi dipisah koma, contoh: guru,karyawan. target_type: "master" (menunjuk sheet master) atau "kelas" (menunjuk sheet di spreadsheet kelas).',
    pkField:'menu_id',
    columns:[
      {key:'menu_id', label:'Menu ID', readonlyOnEdit:true, hint:'unik, tanpa spasi. cth: menu_nilai'},
      {key:'nama_menu', label:'Nama Menu'},
      {key:'icon', label:'Icon (emoji)', hint:'cth: 📘'},
      {key:'urutan', label:'Urutan', hint:'angka, untuk urutan tampil'},
      {key:'role_akses', label:'Role Akses', hint:'pisahkan koma: guru,karyawan,admin_kelas atau * untuk semua'},
      {key:'target_type', label:'Target Type', type:'select', options:['master','kelas']},
      {key:'sheet_name', label:'Nama Sheet Target', hint:'nama sheet yang dibuka saat menu diklik'},
      {key:'status', label:'Status', type:'select', options:['aktif','nonaktif']}
    ],
    load: ()=> call('getMasterList',[TOKEN,'master_menu']),
    onAdd: (obj)=> call('addMasterRow',[TOKEN,'master_menu',obj]),
    onUpdate: (pk,obj)=> call('updateMasterRow',[TOKEN,'master_menu',pk,obj]),
    onDelete: (pk)=> call('deleteMasterRow',[TOKEN,'master_menu',pk])
  });
}

// Menu dinamis yang diklik oleh user (guru/karyawan/admin_kelas/siswa)
function viewDynamicMenu(menuId){
  call('getMenusForUser',[TOKEN]).then(menus=>{
    const m = menus.find(x=>x.menu_id===menuId);
    if(!m){ toast('Menu tidak ditemukan', true); return; }
    if(m.target_type === 'master'){
      const fc = MASTER_FIELD_CONFIG[m.sheet_name];
      if(fc){ viewMasterCrud(m.sheet_name); return; }
      // sheet master tanpa config field spesifik -> tampil read only generik
      renderGenericCrud({
        title:m.nama_menu, readOnly:true, columns:[], pkField:'__row',
        load:()=> call('getMasterList',[TOKEN,m.sheet_name]).then(rows=>{
          if(rows.length){
            const cols = Object.keys(rows[0]).filter(k=>k!=='__row').map(k=>({key:k,label:k}));
            window.__currentCrudConfig.columns = cols;
          }
          return rows;
        })
      });
    } else {
      // target_type kelas: gunakan spreadsheet_id milik user sendiri (admin_kelas/siswa)
      if(!USER.spreadsheet_id){ toast('Anda belum terhubung ke spreadsheet kelas manapun', true); return; }
      viewKelasSheetData(USER.spreadsheet_id, m.sheet_name, m.nama_menu);
    }
  });
}
function viewKelasSheetData(spreadsheetId, sheetName, title){
  call('getSheetHeadersFn',[TOKEN, spreadsheetId, sheetName]).then(headers=>{
    const cols = headers.map(h=>({key:h,label:h}));
    renderGenericCrud({
      title: title || sheetName, columns: cols, pkField:'__row',
      load: ()=> call('getSheetDataFn',[TOKEN, spreadsheetId, sheetName]),
      onAdd: (obj)=> call('addRowToSheet',[TOKEN, spreadsheetId, sheetName, obj]),
      onUpdate: (pk,obj)=> call('updateRowInSheet',[TOKEN, spreadsheetId, sheetName, pk, obj]),
      onDelete: (pk)=> call('deleteRowFromSheet',[TOKEN, spreadsheetId, sheetName, pk])
    });
  }).catch(e=>toast(e.message||String(e), true));
}

// ============================================================
// VIEW: ADMIN KELAS & SPREADSHEET ASSIGNMENT (poin 7, 8, 18, 19) - OWNER
// ============================================================
function viewAdminKelasManager(){
  const content = document.getElementById('content');
  content.innerHTML = `<div class="card"><h2 class="page-title">Pengaturan Admin Kelas & Spreadsheet</h2>
    <p class="muted">Pilih kelas, tentukan Spreadsheet ID untuk kelas tersebut, dan username yang akan dijadikan admin_kelas (harus sudah ada di Master Users).</p>
    <div id="ak-form"></div>
    <h3 style="margin-top:20px">Daftar Kelas</h3>
    <div id="ak-table"><p class="muted">Memuat...</p></div>
  </div>`;
  Promise.all([
    call('getMasterList',[TOKEN,'master_kelas']),
    call('getUsersForAssign',[TOKEN])
  ]).then(([kelasList, users])=>{
    let opts1 = kelasList.map(k=>`<option value="${k.kode_kelas}">${k.kode_kelas} - ${k.nama_kelas}</option>`).join('');
    let opts2 = users.map(u=>`<option value="${u.username}">${u.username} (${u.role})</option>`).join('');
    document.getElementById('ak-form').innerHTML = `
      <div class="flexrow">
        <div><label>Kelas</label><select id="ak-kelas">${opts1}</select></div>
        <div><label>Username Admin Kelas</label><select id="ak-user">${opts2}</select></div>
        <div><label>Spreadsheet ID Kelas</label><input id="ak-sid" placeholder="tempel Spreadsheet ID di sini"></div>
        <div><button onclick="submitAssignAdminKelas()">Simpan</button></div>
      </div>`;
    let rows = '<table><thead><tr><th>Kode</th><th>Nama Kelas</th><th>Spreadsheet ID</th><th>Admin Kelas</th></tr></thead><tbody>';
    kelasList.forEach(k=>{ rows += `<tr><td>${k.kode_kelas}</td><td>${k.nama_kelas}</td><td>${k.spreadsheet_id||'-'}</td><td>${k.admin_kelas_username||'-'}</td></tr>`; });
    rows += '</tbody></table>';
    document.getElementById('ak-table').innerHTML = rows;
  });
}
function submitAssignAdminKelas(){
  const kelas = document.getElementById('ak-kelas').value;
  const user = document.getElementById('ak-user').value;
  const sid = document.getElementById('ak-sid').value.trim();
  if(!sid){ toast('Spreadsheet ID wajib diisi', true); return; }
  call('assignAdminKelas',[TOKEN, kelas, user, sid]).then(res=>{
    toast(res.message); viewAdminKelasManager();
  }).catch(e=>toast(e.message||String(e), true));
}

// ============================================================
// VIEW: MODUL KEGIATAN BUILDER (poin 20, 21, 22) - OWNER
// ============================================================
function viewModulManager(){
  const content = document.getElementById('content');
  content.innerHTML = `<div class="card">
    <h2 class="page-title">Modul Kegiatan (Builder)</h2>
    <p class="muted">Modul berisi definisi sheet + kolom yang nantinya bisa diaktifkan oleh admin_kelas di kelasnya masing-masing.</p>
    <button onclick="openModulEditor(null)">+ Buat Modul Baru</button>
    <div id="modul-list" style="margin-top:14px"><p class="muted">Memuat...</p></div>
  </div>`;
  call('listModulesAll',[TOKEN]).then(list=>{
    let html = '';
    list.forEach(m=>{
      html += `<div class="card">
        <strong>${m.nama_modul}</strong> <span class="pill">${m.modul_id}</span> <span class="pill">${m.status}</span>
        <p class="muted">${m.keterangan}</p>
        <button class="small secondary" onclick='openModulEditor(${JSON.stringify(m).replace(/'/g,"&#39;")})'>Edit</button>
      </div>`;
    });
    document.getElementById('modul-list').innerHTML = html || '<p class="muted">Belum ada modul.</p>';
  });
}
let __modulSheets = [];
function openModulEditor(existing){
  __modulSheets = existing ? JSON.parse(existing.template_json) : [{sheet_name:'', columns:[{name:'',note:''}]}];
  const html = `
    <h3>${existing ? 'Edit Modul' : 'Buat Modul Baru'}</h3>
    <label>Modul ID</label><input id="mm-id" value="${existing?existing.modul_id:''}" ${existing?'disabled':''} placeholder="cth: MODUL_UPACARA">
    <label>Nama Modul</label><input id="mm-nama" value="${existing?existing.nama_modul:''}">
    <label>Keterangan</label><textarea id="mm-ket" rows="2">${existing?existing.keterangan:''}</textarea>
    <h4>Sheet & Kolom</h4>
    <div id="mm-sheets"></div>
    <button class="small secondary" onclick="addModulSheetBlock()">+ Tambah Sheet</button>
    <div style="margin-top:16px;text-align:right">
      <button class="secondary" onclick="closeModal()">Batal</button>
      <button onclick="submitModul(${existing?'true':'false'})">Simpan Modul</button>
    </div>
  `;
  showModal(html);
  renderModulSheetBlocks();
}
function renderModulSheetBlocks(){
  let html = '';
  __modulSheets.forEach((s, si)=>{
    html += `<div class="col-block">
      <label>Nama Sheet (huruf besar/underscore, cth: TRX_7KAIH)</label>
      <input value="${s.sheet_name}" onchange="__modulSheets[${si}].sheet_name=this.value">
      <div class="hint">Ini akan menjadi nama tab sheet di spreadsheet kelas.</div>
      <div id="mm-cols-${si}"></div>
      <button class="small secondary" onclick="addModulColumn(${si})">+ Tambah Kolom</button>
      <div style="margin-top:6px"><button class="small danger" onclick="removeModulSheet(${si})">Hapus Sheet Ini</button></div>
    </div>`;
  });
  document.getElementById('mm-sheets').innerHTML = html;
  __modulSheets.forEach((s,si)=> renderModulColumns(si));
}
function renderModulColumns(si){
  const wrap = document.getElementById('mm-cols-'+si);
  let html = '';
  __modulSheets[si].columns.forEach((c, ci)=>{
    html += `<div class="col-row">
      <input placeholder="nama_kolom" value="${c.name}" onchange="__modulSheets[${si}].columns[${ci}].name=this.value" style="flex:1">
      <input placeholder="petunjuk singkat cara isi kolom" value="${c.note||''}" onchange="__modulSheets[${si}].columns[${ci}].note=this.value" style="flex:2">
      <button class="small danger" onclick="removeModulColumn(${si},${ci})">x</button>
    </div>`;
  });
  wrap.innerHTML = html || '<p class="hint">Belum ada kolom</p>';
}
function addModulSheetBlock(){ __modulSheets.push({sheet_name:'',columns:[{name:'',note:''}]}); renderModulSheetBlocks(); }
function removeModulSheet(si){ __modulSheets.splice(si,1); renderModulSheetBlocks(); }
function addModulColumn(si){ __modulSheets[si].columns.push({name:'',note:''}); renderModulColumns(si); }
function removeModulColumn(si,ci){ __modulSheets[si].columns.splice(ci,1); renderModulColumns(si); }
function submitModul(isEdit){
  const id = document.getElementById('mm-id').value.trim();
  const nama = document.getElementById('mm-nama').value.trim();
  const ket = document.getElementById('mm-ket').value.trim();
  if(!id || !nama){ toast('Modul ID dan Nama wajib diisi', true); return; }
  call('saveModul',[TOKEN, id, nama, ket, __modulSheets, !isEdit]).then(res=>{
    toast(res.message); closeModal(); viewModulManager();
  }).catch(e=>toast(e.message||String(e), true));
}

// ============================================================
// VIEW: AKTIVASI MODUL OLEH ADMIN_KELAS (poin 21)
// ============================================================
function viewModulAktivasi(){
  const content = document.getElementById('content');
  content.innerHTML = `<div class="card"><h2 class="page-title">Aktivasi Modul Kegiatan</h2>
    <p class="muted">Klik "Aktifkan" untuk membuat sheet & kolom kegiatan modul ini di spreadsheet kelas Anda.</p>
    <div id="modul-aktivasi-list"><p class="muted">Memuat...</p></div>
  </div>`;
  Promise.all([
    call('listModulesForActivation',[TOKEN]),
    call('getActiveModulesForKelas',[TOKEN, USER.kode_kelas])
  ]).then(([modules, actives])=>{
    let html = '';
    modules.forEach(m=>{
      const active = actives.find(a=>a.modul_id===m.modul_id && a.status_aktif==='aktif');
      html += `<div class="card">
        <strong>${m.nama_modul}</strong> ${active?'<span class="pill">Sudah Aktif</span>':''}
        <p class="muted">${m.keterangan}</p>
        <button onclick="submitActivateModul('${m.modul_id}')">${active?'Perbarui Sheet/Kolom':'Aktifkan untuk Kelas Saya'}</button>
      </div>`;
    });
    document.getElementById('modul-aktivasi-list').innerHTML = html || '<p class="muted">Belum ada modul tersedia.</p>';
  });
}
function submitActivateModul(modulId){
  call('activateModulForKelas',[TOKEN, USER.kode_kelas, modulId]).then(res=>{
    toast(res.message); viewModulAktivasi();
  }).catch(e=>toast(e.message||String(e), true));
}

// ============================================================
// VIEW: SHEET & KOLOM BUILDER MANUAL (poin 2, 14, 15, 17, 18) - OWNER & ADMIN_KELAS
// ============================================================
function viewSheetBuilder(){
  const content = document.getElementById('content');
  content.innerHTML = `<div class="card">
    <h2 class="page-title">Sheet & Kolom per Kelas</h2>
    <p class="muted">Pilih spreadsheet kelas, lalu kelola sheet dan kolom di dalamnya secara langsung dari sini.</p>
    <div id="sb-select"></div>
    <div id="sb-sheets" style="margin-top:14px"></div>
  </div>`;
  if(USER.role === 'owner'){
    call('listAllKelasSpreadsheets',[TOKEN]).then(list=>{
      let opts = list.filter(k=>k.spreadsheet_id).map(k=>`<option value="${k.spreadsheet_id}">${k.kode_kelas} - ${k.nama_kelas}</option>`).join('');
      document.getElementById('sb-select').innerHTML = `<label>Pilih Kelas</label><select id="sb-sid" onchange="loadSheetBuilderSheets(this.value)"><option value="">-- pilih --</option>${opts}</select>`;
    });
  } else {
    document.getElementById('sb-select').innerHTML = '';
    loadSheetBuilderSheets(USER.spreadsheet_id);
  }
}
function loadSheetBuilderSheets(spreadsheetId){
  if(!spreadsheetId) return;
  call('listSpreadsheetSheets',[TOKEN, spreadsheetId]).then(sheets=>{
    let html = `<div class="flexrow"><div><button onclick="openCreateSheetForm('${spreadsheetId}')">+ Tambah Sheet Baru</button></div></div><div style="margin-top:10px">`;
    sheets.forEach(s=>{
      html += `<div class="pill" style="cursor:pointer;font-size:13px;padding:6px 12px" onclick="openManageColumns('${spreadsheetId}','${s}')">${s}</div>`;
    });
    html += '</div><div id="sb-cols" style="margin-top:14px"></div>';
    document.getElementById('sb-sheets').innerHTML = html;
  }).catch(e=>toast(e.message||String(e), true));
}
function openCreateSheetForm(spreadsheetId){
  __modulSheets = [{sheet_name:'', columns:[{name:'',note:''}]}];
  const html = `
    <h3>Tambah Sheet Baru</h3>
    <div id="mm-sheets"></div>
    <div style="margin-top:16px;text-align:right">
      <button class="secondary" onclick="closeModal()">Batal</button>
      <button onclick="submitCreateSheet('${spreadsheetId}')">Buat Sheet</button>
    </div>`;
  showModal(html);
  renderModulSheetBlocks();
}
function submitCreateSheet(spreadsheetId){
  const s = __modulSheets[0];
  if(!s.sheet_name){ toast('Nama sheet wajib diisi', true); return; }
  call('createSheetWithHeaders',[TOKEN, spreadsheetId, s.sheet_name, s.columns]).then(res=>{
    toast(res.message); closeModal(); loadSheetBuilderSheets(spreadsheetId);
  }).catch(e=>toast(e.message||String(e), true));
}
function openManageColumns(spreadsheetId, sheetName){
  call('getSheetHeadersFn',[TOKEN, spreadsheetId, sheetName]).then(headers=>{
    let html = `<div class="card"><h3>Kolom Sheet: ${sheetName}</h3>`;
    headers.forEach(h=>{
      html += `<span class="pill">${h} <a href="#" style="color:var(--danger)" onclick="removeColumn('${spreadsheetId}','${sheetName}','${h}');return false;">x</a></span>`;
    });
    html += `<div class="flexrow" style="margin-top:10px">
      <div><label>Tambah Kolom Baru</label><input id="newcol-name" placeholder="nama_kolom_baru"></div>
      <div><button onclick="addColumnSubmit('${spreadsheetId}','${sheetName}')">Tambah Kolom</button></div>
    </div>
    <div class="hint">Gunakan huruf kecil dan underscore untuk nama kolom, contoh: tanggal, nama_siswa, nilai_akhir. Jangan gunakan spasi.</div>
    </div>`;
    document.getElementById('sb-cols').innerHTML = html;
  }).catch(e=>toast(e.message||String(e), true));
}
function addColumnSubmit(spreadsheetId, sheetName){
  const col = document.getElementById('newcol-name').value.trim();
  if(!col){ toast('Nama kolom wajib diisi', true); return; }
  call('addColumnToSheetFn',[TOKEN, spreadsheetId, sheetName, col]).then(res=>{
    toast(res.message); openManageColumns(spreadsheetId, sheetName);
  }).catch(e=>toast(e.message||String(e), true));
}
function removeColumn(spreadsheetId, sheetName, col){
  if(!confirm('Hapus kolom "'+col+'"? Data pada kolom ini akan hilang.')) return;
  call('deleteColumnFromSheetFn',[TOKEN, spreadsheetId, sheetName, col]).then(res=>{
    toast(res.message); openManageColumns(spreadsheetId, sheetName);
  }).catch(e=>toast(e.message||String(e), true));
}

// VIEW: DATA SISWA (poin 10) - ADMIN_KELAS
// ============================================================
function viewSiswaManager(){
  renderGenericCrud({
    title:'Data Siswa Kelas Saya',
    note:'Username & password siswa dibuat dan dikelola di sini oleh admin_kelas.',
    pkField:'__row',
    columns:[
      {key:'nis', label:'NIS'},
      {key:'nama', label:'Nama'},
      {key:'username', label:'Username'},
      {key:'password', label:'Password', type:'password', hint:'Kosongkan saat edit jika tidak ingin mengubah password. Saat tambah baru, default 123456 jika dikosongkan.'},
      {key:'jenis_kelamin', label:'Jenis Kelamin', type:'select', options:['L','P']},
      {key:'status', label:'Status', type:'select', options:['aktif','nonaktif']}
    ],
    load: ()=> call('getSiswaList',[TOKEN, USER.spreadsheet_id]),
    onAdd: (obj)=> call('addSiswa',[TOKEN, USER.spreadsheet_id, obj]),
    onUpdate: (pk,obj)=> call('updateSiswa',[TOKEN, USER.spreadsheet_id, pk, obj]),
    onDelete: (pk)=> call('deleteSiswa',[TOKEN, USER.spreadsheet_id, pk])
  });
}

// ============================================================
// VIEW: AGREGASI DATA SEMUA KELAS (poin 23) - OWNER
// ============================================================
function viewAggregasi(){
  const content = document.getElementById('content');
  content.innerHTML = `<div class="card">
    <h2 class="page-title">Agregasi Data Semua Kelas</h2>
    <p class="muted">Masukkan nama sheet yang ingin diagregasi dari seluruh spreadsheet kelas (contoh: siswa, TRX_7KAIH).</p>
    <div class="flexrow">
      <div><input id="agg-sheet" placeholder="nama sheet, cth: siswa"></div>
      <div><button onclick="submitAggregasi()">Tampilkan</button></div>
    </div>
    <div id="agg-result" style="margin-top:14px"></div>
  </div>`;
}
function submitAggregasi(){
  const sheetName = document.getElementById('agg-sheet').value.trim();
  if(!sheetName){ toast('Nama sheet wajib diisi', true); return; }
  call('aggregateSheetAcrossKelas',[TOKEN, sheetName]).then(rows=>{
    if(!rows.length){ document.getElementById('agg-result').innerHTML = '<p class="muted">Tidak ada data ditemukan.</p>'; return; }
    const keys = Object.keys(rows[0]).filter(k=>k!=='__row');
    let html = '<table><thead><tr>' + keys.map(k=>`<th>${k}</th>`).join('') + '</tr></thead><tbody>';
    rows.forEach(r=>{ html += '<tr>' + keys.map(k=>`<td>${r[k]!==undefined&&r[k]!==null?r[k]:''}</td>`).join('') + '</tr>'; });
    html += '</tbody></table>';
    document.getElementById('agg-result').innerHTML = html;
  }).catch(e=>toast(e.message||String(e), true));
}
</script>
